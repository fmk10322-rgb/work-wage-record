<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7f2" />
    <title>就労作業・工賃記録</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="page-header">
        <p class="eyebrow">MY WORK LOG</p>
        <h1>就労作業・工賃記録</h1>
        <p class="subtle">作業時間と工賃を、毎日かんたんに記録</p>
      </header>

      <section class="month-nav" aria-label="表示する月を選ぶ">
        <button class="icon-button" id="previous-month" type="button" aria-label="前月">‹</button>
        <h2 id="month-title">----</h2>
        <button class="icon-button" id="next-month" type="button" aria-label="次月">›</button>
      </section>

      <section class="summary-section" aria-labelledby="today-heading">
        <div class="section-heading"><h2 id="today-heading">今日の作業</h2><span id="today-date"></span></div>
        <div class="today-card" id="today-summary"></div>
      </section>

      <section class="summary-section" aria-labelledby="month-heading">
        <div class="section-heading"><h2 id="month-heading">今月のまとめ</h2></div>
        <div class="stat-grid" id="month-summary"></div>
      </section>

      <section class="panel" aria-labelledby="form-heading">
        <div class="panel-title-row">
          <h2 id="form-heading">作業を記録</h2>
          <button class="text-button hidden" id="cancel-edit" type="button">編集をやめる</button>
        </div>
        <form id="record-form" novalidate>
          <div class="form-grid">
            <label>日付<input id="record-date" name="date" type="date" required /></label>
            <label>作業形態
              <select id="record-type" name="type" required>
                <option value="通所">通所</option><option value="在宅">在宅</option>
              </select>
            </label>
            <label>開始時刻<input id="start-time" name="startTime" type="time" required /></label>
            <label>終了時刻<input id="end-time" name="endTime" type="time" required /></label>
            <label>休憩時間（分）<input id="break-minutes" name="breakMinutes" type="number" inputmode="numeric" min="0" step="1" value="0" required /></label>
          </div>
          <label class="full-width">メモ（任意）<textarea id="record-memo" name="memo" rows="2" placeholder="作業内容など"></textarea></label>
          <div class="calculation-preview" id="calculation-preview">開始時刻と終了時刻を入力すると、実作業時間と工賃を表示します。</div>
          <p class="form-error" id="form-error" role="alert"></p>
          <button class="primary-button" id="save-record" type="submit">記録を登録する</button>
        </form>
      </section>

      <section class="panel" aria-labelledby="records-heading">
        <div class="panel-title-row"><h2 id="records-heading">作業記録一覧</h2><span class="subtle" id="record-count"></span></div>
        <div id="record-list" class="record-list"></div>
      </section>

      <section class="panel settings-panel" aria-labelledby="settings-heading">
        <h2 id="settings-heading">工賃の設定</h2>
        <p class="subtle">設定はこのブラウザに保存されます。</p>
        <form id="settings-form" class="settings-form" novalidate>
          <label>時間あたりの工賃（円）<input id="hourly-wage" name="hourlyWage" type="number" inputmode="numeric" min="0" step="1" required /></label>
          <label>皆勤手当（円）<input id="attendance-allowance" name="attendanceAllowance" type="number" inputmode="numeric" min="0" step="1" required /></label>
          <p class="form-error" id="settings-error" role="alert"></p>
          <button class="secondary-button" type="submit">設定を保存する</button>
        </form>
      </section>

      <section class="panel cloud-panel" aria-labelledby="cloud-heading">
        <h2 id="cloud-heading">クラウド同期</h2>
        <p class="subtle" id="cloud-status">クラウド同期はまだ設定されていません。</p>
        <form id="cloud-login-form" class="cloud-login-form hidden" novalidate>
          <label>メールアドレス<input id="cloud-email" type="email" inputmode="email" autocomplete="email" placeholder="example@email.com" required /></label>
          <p class="form-error" id="cloud-error" role="alert"></p>
          <button class="secondary-button" type="submit">ログイン用リンクをメールで送る</button>
        </form>
        <button class="text-button hidden" id="cloud-sign-out" type="button">クラウドからログアウト</button>
      </section>
    </main>
    <template id="record-template">
      <article class="record-card">
        <div class="record-main"><div class="record-top"><strong class="record-date"></strong><span class="type-badge"></span></div><p class="record-time"></p><p class="record-memo hidden"></p></div>
        <div class="record-amount"><strong class="record-duration"></strong><span class="record-wage"></span></div>
        <div class="record-actions"><button class="edit-button" type="button">編集</button><button class="delete-button" type="button">削除</button></div>
      </article>
    </template>
    <script src="./cloud-config.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
